<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a202c"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="#ffffff"/>

  <text x="450" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Fipik — Архитектура автономного дрона
  </text>

  <!-- Arduino UNO Q -->
  <rect x="330" y="80" width="260" height="180" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="460" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    Arduino UNO Q
  </text>
  <text x="460" y="140" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    Qualcomm QRB2210
  </text>
  <text x="460" y="162" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    4× Cortex-A53 @ 2.0 GHz
  </text>
  <text x="460" y="184" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    Adreno GPU + AI
  </text>
  <text x="460" y="206" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    STM32U585 MCU
  </text>

  <!-- USB Camera -->
  <rect x="60" y="110" width="160" height="80" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="140" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">
    USB UVC
  </text>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6b21a8">
    Камера
  </text>

  <!-- GPS -->
  <rect x="60" y="230" width="160" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="260" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">
    u-blox M10
  </text>
  <text x="140" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#14532d">
    GPS / ГЛОНАСС
  </text>

  <!-- Fipik ESP32 -->
  <rect x="330" y="320" width="260" height="150" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="460" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7c2d12">
    Fipik ESP32-WROOM-32
  </text>
  <text x="460" y="380" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    PWM, PID, стабилизация
  </text>
  <text x="460" y="402" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    ELRS приёмник
  </text>
  <text x="460" y="424" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    MPU-6050 / GY-271 / BMP280
  </text>

  <!-- ESC / Motors -->
  <rect x="670" y="340" width="170" height="110" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="755" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    ESC
  </text>
  <text x="755" y="400" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#991b1b">
    4 × PWM
  </text>
  <text x="755" y="425" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#991b1b">
    Моторы
  </text>

  <!-- RC Transmitter -->
  <rect x="60" y="420" width="160" height="80" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="140" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#713f12">
    ELRS Пульт
  </text>
  <text x="140" y="475" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#713f12">
    RC управление
  </text>

  <!-- Power -->
  <rect x="60" y="530" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="140" y="558" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">
    LiPo + BEC 5V 5A
  </text>
  <text x="140" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">
    Питание
  </text>

  <!-- Arrows -->
  <line x1="220" y1="150" x2="330" y2="150" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">USB</text>

  <line x1="220" y1="270" x2="330" y2="190" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="265" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">UART</text>

  <line x1="460" y1="260" x2="460" y2="320" stroke="#1a202c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="500" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a202c">UART</text>
  <text x="535" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a5568">roll/pitch/yaw/throttle</text>

  <line x1="590" y1="395" x2="670" y2="395" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="630" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">4× PWM</text>

  <line x1="220" y1="460" x2="330" y2="395" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="415" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">SBUS/CRSF</text>

  <!-- Power lines -->
  <line x1="220" y1="565" x2="460" y2="565" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="460" y1="565" x2="460" y2="470" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="460" y1="470" x2="460" y2="320" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dc2626">5V питание</text>

  <!-- Legend -->
  <rect x="670" y="80" width="190" height="130" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1"/>
  <text x="685" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">UNO Q:</text>
  <text x="685" y="132" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">CV, GPS, миссия</text>
  <text x="685" y="157" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">Fipik ESP32:</text>
  <text x="685" y="179" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Стабилизация</text>
  <text x="685" y="204" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">Ручной:</text>
  <text x="685" y="226" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">ELRS пульт</text>

  <!-- Mission -->
  <text x="460" y="625" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748" font-style="italic">
    Взлёт → Точка GPS → Возврат домой
  </text>
</svg>