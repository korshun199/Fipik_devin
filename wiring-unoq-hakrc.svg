<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a202c"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Подключение UNO Q, камера, GPS
  </text>

  <!-- UNO Q -->
  <rect x="100" y="100" width="220" height="180" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="210" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    Arduino UNO Q
  </text>
  <text x="210" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    Linux + AI
  </text>
  <text x="210" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    CV, GPS, миссия
  </text>

  <!-- GPS -->
  <rect x="80" y="360" width="160" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="160" y="390" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">
    u-blox M10
  </text>
  <text x="160" y="415" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#14532d">
    GPS / ГЛОНАСС
  </text>

  <!-- HAKRC -->
  <rect x="480" y="100" width="240" height="260" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7c2d12">
    HAKRC F405 V2
  </text>
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    Betaflight
  </text>
  <text x="600" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    PID, стабилизация
  </text>

  <!-- HAKRC pins list -->
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="bold">UART3:</text>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">TX = B10</text>
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">RX = B11</text>
  <text x="500" y="290" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="bold">CAM:</text>
  <text x="500" y="310" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">CAM IN</text>
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">5V, GND</text>

  <!-- Camera -->
  <rect x="500" y="420" width="140" height="70" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="570" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">
    FPV камера
  </text>
  <text x="570" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b21a8">
    аналоговая
  </text>

  <!-- Arrows UNO Q to HAKRC -->
  <line x1="320" y1="170" x2="480" y2="170" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">UART3 / MSP</text>

  <!-- Pin labels -->
  <text x="340" y="195" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">UNO TX → B11</text>
  <text x="340" y="215" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">UNO RX ← B10</text>

  <!-- GPS to UNO Q -->
  <line x1="160" y1="360" x2="210" y2="280" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">UART</text>

  <!-- Pin labels GPS -->
  <text x="180" y="325" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">TX → RX UNO</text>
  <text x="180" y="345" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">RX ← TX UNO</text>

  <!-- Camera to HAKRC -->
  <line x1="570" y1="420" x2="600" y2="360" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="405" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a202c">Видео</text>

  <!-- Power -->
  <line x1="210" y1="280" x2="600" y2="360" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead-red)"/>
  <text x="370" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dc2626">5V питание</text>

  <!-- Notes -->
  <rect x="50" y="500" width="700" height="70" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <text x="70" y="525" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">
    UNO Q по UART3/MSP говорит HAKRC: roll, pitch, yaw, throttle
  </text>
  <text x="70" y="545" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">
    GPS идёт в UNO Q, не в HAKRC. Камера идёт в HAKRC для OSD/FPV.
  </text>
  <text x="70" y="565" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">
    Питание 5V от HAKRC BEC или внешнего BEC.
  </text>
</svg>