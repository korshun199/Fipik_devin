<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a202c"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#ffffff"/>

  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Физическая схема: UNO Q, HAKRC, GPS, камера (USB-UART)
  </text>

  <!-- UNO Q -->
  <rect x="350" y="90" width="200" height="140" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    Arduino UNO Q
  </text>
  <text x="450" y="150" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    Linux (QRB2210)
  </text>
  <text x="450" y="175" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    Python, OpenCV, ИИ
  </text>
  <text x="450" y="200" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">
    USB host
  </text>

  <!-- USB Hub -->
  <rect x="370" y="270" width="160" height="60" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="450" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#713f12">
    USB Hub
  </text>

  <!-- PL2303 -->
  <rect x="120" y="400" width="170" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="205" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">
    USB-UART #1
  </text>
  <text x="205" y="455" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5568">
    PL2303 / CP2102
  </text>

  <!-- PL2303 pins -->
  <text x="205" y="500" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">
    TX RX GND 5V
  </text>

  <!-- USB-UART #2 -->
  <rect x="590" y="400" width="170" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="675" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">
    USB-UART #2
  </text>
  <text x="675" y="455" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5568">
    CP2102 / CH340
  </text>

  <!-- USB-UART #2 pins -->
  <text x="675" y="500" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">
    TX RX GND 5V
  </text>

  <!-- HAKRC -->
  <rect x="50" y="540" width="240" height="120" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="170" y="575" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7c2d12">
    HAKRC F405 V2
  </text>
  <text x="170" y="600" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    Betaflight
  </text>
  <text x="170" y="625" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">
    UART3: B10 TX, B11 RX
  </text>

  <!-- Camera -->
  <rect x="360" y="540" width="180" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="450" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">
    FPV камера
  </text>
  <text x="450" y="600" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6b21a8">
    CAM IN → HAKRC
  </text>
  <text x="450" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b21a8">
    5V, GND
  </text>

  <!-- GPS -->
  <rect x="590" y="540" width="170" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="675" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">
    u-blox M10
  </text>
  <text x="675" y="600" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#14532d">
    GPS
  </text>
  <text x="675" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#14532d">
    TX RX GND 5V
  </text>

  <!-- Arrows -->
  <!-- UNO Q to USB Hub -->
  <line x1="450" y1="230" x2="450" y2="270" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- USB Hub to PL2303 -->
  <line x1="370" y1="300" x2="205" y2="400" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="255" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a202c">USB</text>

  <!-- USB Hub to USB-UART #2 -->
  <line x1="530" y1="300" x2="675" y2="400" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="645" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a202c">USB</text>

  <!-- PL2303 to HAKRC -->
  <line x1="205" y1="490" x2="170" y2="540" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a202c">UART</text>

  <!-- Pin labels -->
  <text x="140" y="510" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">TX→B11</text>
  <text x="240" y="510" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">RX←B10</text>

  <!-- USB-UART #2 to GPS -->
  <line x1="675" y1="490" x2="675" y2="540" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a202c">UART</text>

  <!-- Camera to HAKRC -->
  <line x1="450" y1="540" x2="290" y2="600" stroke="#1a202c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="585" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a202c">Видео</text>

  <!-- Power -->
  <line x1="150" y1="620" x2="450" y2="260" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead-red)"/>
  <text x="270" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dc2626">5V питание</text>

  <!-- Notes -->
  <rect x="50" y="40" width="800" height="40" rx="4" fill="#f3f4f6" stroke="#cbd5e0" stroke-width="1"/>
  <text x="70" y="65" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">
    UNO Q: Linux на QRB2210. Связь с HAKRC и GPS — через USB-UART адаптеры.
  </text>
</svg>