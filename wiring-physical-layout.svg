<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="#f9fafb"/>

  <text x="500" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">
    Физическая схема: где торчат USB-UART и куда идут провода
  </text>

  <!-- UNO Q -->
  <rect x="350" y="80" width="300" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Arduino UNO Q</text>
  <text x="500" y="145" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">Linux (QRB2210) + ИИ + OpenCV</text>
  <text x="500" y="165" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">USB-C питание/данные</text>

  <!-- USB-C port -->
  <rect x="460" y="190" width="80" height="15" rx="4" fill="#374151"/>
  <text x="500" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4b5563">USB-C → питание и UNO Q</text>

  <!-- USB Hub -->
  <rect x="370" y="280" width="260" height="90" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#713f12">USB Hub</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#713f12">подключён к UNO Q</text>

  <!-- USB Hub ports -->
  <rect x="400" y="370" width="50" height="20" rx="3" fill="#9ca3af"/>
  <text x="425" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">port 1</text>

  <rect x="470" y="370" width="50" height="20" rx="3" fill="#9ca3af"/>
  <text x="495" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">port 2</text>

  <rect x="540" y="370" width="50" height="20" rx="3" fill="#9ca3af"/>
  <text x="565" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">port 3</text>

  <!-- Cable UNO Q to Hub -->
  <line x1="500" y1="205" x2="500" y2="280" stroke="#1f2937" stroke-width="4" fill="none"/>

  <!-- USB-UART #1 -->
  <rect x="80" y="440" width="120" height="80" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">USB-UART #1</text>
  <text x="140" y="490" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4b5563">PL2303 / CP2102</text>
  <text x="140" y="510" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">/dev/ttyUSB0</text>

  <!-- USB connector -->
  <rect x="125" y="435" width="30" height="10" rx="2" fill="#1f2937"/>
  <text x="140" y="535" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">USB-штекер → Hub port 1</text>

  <!-- Cable Hub to UART1 -->
  <path d="M 400 380 L 140 380 L 140 435" stroke="#1f2937" stroke-width="3" fill="none"/>

  <!-- UART1 pins -->
  <rect x="100" y="560" width="80" height="50" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="140" y="575" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f2937">VCC TX RX GND</text>
  <text x="140" y="595" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">провода к HAKRC</text>

  <!-- Wires UART1 to HAKRC -->
  <line x1="140" y1="610" x2="140" y2="650" stroke="#1f2937" stroke-width="2"/>
  <text x="140" y="665" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#4b5563">4 провода</text>

  <!-- USB-UART #2 -->
  <rect x="780" y="440" width="120" height="80" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">USB-UART #2</text>
  <text x="840" y="490" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4b5563">CP2102 / CH340</text>
  <text x="840" y="510" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">/dev/ttyUSB1</text>

  <!-- USB connector -->
  <rect x="825" y="435" width="30" height="10" rx="2" fill="#1f2937"/>
  <text x="840" y="535" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">USB-штекер → Hub port 2</text>

  <!-- Cable Hub to UART2 -->
  <path d="M 520 380 L 840 380 L 840 435" stroke="#1f2937" stroke-width="3" fill="none"/>

  <!-- UART2 pins -->
  <rect x="820" y="560" width="80" height="50" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="860" y="575" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1f2937">VCC TX RX GND</text>
  <text x="860" y="595" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563">провода к GPS</text>

  <!-- Wires UART2 to GPS -->
  <line x1="860" y1="610" x2="860" y2="650" stroke="#1f2937" stroke-width="2"/>
  <text x="860" y="665" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#4b5563">4 провода</text>

  <!-- HAKRC -->
  <rect x="80" y="690" width="200" height="80" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c2d12">HAKRC F4530V2</text>
  <text x="180" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9a3412">RX6 TX6 5V GND</text>
  <text x="180" y="765" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9a3412">E1 E2 E3 E4 / CAM</text>

  <!-- GPS -->
  <rect x="780" y="690" width="150" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">u-blox M10</text>
  <text x="855" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#14532d">VCC TX RX GND</text>

  <!-- FPV Camera -->
  <rect x="360" y="690" width="160" height="80" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">FPV камера</text>
  <text x="440" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b21a8">Video 5V GND</text>
  <text x="440" y="765" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b21a8">→ HAKRC CAM</text>

  <!-- LiPo -->
  <rect x="50" y="620" width="120" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">LiPo</text>
  <text x="110" y="665" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f1d1d" transform="rotate(0 110 665)">24V → HAKRC VBAT</text>

  <!-- Cable LiPo to HAKRC -->
  <line x1="110" y1="620" x2="110" y2="690" stroke="#dc2626" stroke-width="3" fill="none"/>

  <!-- ESC -->
  <rect x="300" y="600" width="140" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#064e3b">4 ESC / 4 мотора</text>
  <text x="370" y="635" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#064e3b">E1 E2 E3 E4</text>

  <!-- Cable ESC to HAKRC -->
  <line x1="300" y1="620" x2="280" y2="690" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- ELRS -->
  <rect x="560" y="600" width="140" height="40" rx="6" fill="#e0e7ff" stroke="#3730a3" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">ELRS приёмник</text>
  <text x="630" y="635" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#312e81">CH1 CH2 5V GND</text>

  <!-- Cable ELRS to HAKRC -->
  <line x1="560" y1="620" x2="280" y2="690" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- Cable UART1 to HAKRC -->
  <line x1="140" y1="650" x2="140" y2="690" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- Cable UART2 to GPS -->
  <line x1="860" y1="650" x2="860" y2="690" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- Cable camera to HAKRC -->
  <line x1="440" y1="690" x2="280" y2="720" stroke="#7e22ce" stroke-width="2" fill="none"/>

  <!-- Legend -->
  <rect x="680" y="80" width="280" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Обозначения</text>
  <text x="700" y="140" font-family="Arial, sans-serif" font-size="12" fill="#374151">USB-UART = маленький</text>
  <text x="700" y="160" font-family="Arial, sans-serif" font-size="12" fill="#374151">переходник USB→UART</text>
  <text x="700" y="185" font-family="Arial, sans-serif" font-size="12" fill="#374151">USB Hub = разветвитель</text>
  <text x="700" y="205" font-family="Arial, sans-serif" font-size="12" fill="#374151">UNO Q видит UARTы</text>
  <text x="700" y="225" font-family="Arial, sans-serif" font-size="12" fill="#374151">как /dev/ttyUSB*</text>
</svg>